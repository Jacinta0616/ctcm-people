<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法會人數統計 — 公開查看</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #2d4a6e; --navy-light: #e8f0fb;
  --bg: #f4f6f9; --card: #fff; --muted: #666;
  --border: #e0e0e0; --danger: #c62828;
  --success: #2e7d32; --warn: #e65100; --radius: 10px;
}
body { font-family: -apple-system,'PingFang TC','Noto Sans TC',sans-serif; background:var(--bg); color:#1a1a1a; min-height:100vh; }
header { background:var(--navy); color:white; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; position:sticky; top:0; z-index:20; }
.header-left { display:flex; flex-direction:column; }
.btn-admin { padding:7px 14px; font-size:13px; font-weight:600; background:rgba(255,255,255,.18); color:white; border:1.5px solid rgba(255,255,255,.5); border-radius:7px; cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-block; transition:background .15s; }
.btn-admin:hover { background:rgba(255,255,255,.3); }
header h1 { font-size:17px; font-weight:600; }
header p  { font-size:12px; opacity:.7; }
.container { max-width:1100px; margin:0 auto; padding:16px; }
.btn { padding:9px 18px; font-size:14px; font-weight:600; border:none; border-radius:8px; cursor:pointer; }
.btn-outline { background:white; color:var(--navy); border:2px solid var(--navy); }
.btn-sm { padding:6px 13px; font-size:13px; }
.control-bar { background:var(--card); border-radius:var(--radius); padding:12px 16px; margin-bottom:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; box-shadow:0 1px 3px rgba(0,0,0,.07); }
.control-bar label { font-size:14px; color:var(--muted); white-space:nowrap; }
.control-bar select { padding:7px 12px; font-size:14px; border:2px solid var(--border); border-radius:8px; background:white; }
.control-bar select:focus { border-color:var(--navy); outline:none; }
.last-update { font-size:12px; color:var(--muted); margin-left:auto; }
.tab-group { display:flex; gap:3px; background:var(--card); border-radius:9px; padding:4px; box-shadow:0 1px 3px rgba(0,0,0,.07); margin-bottom:14px; flex-wrap:wrap; }
.tab-btn { padding:8px 16px; font-size:13px; font-weight:600; border:none; border-radius:7px; background:transparent; color:var(--muted); cursor:pointer; }
.tab-btn.active { background:var(--navy); color:white; }
.tab-btn:not(.active):hover { background:var(--navy-light); color:var(--navy); }
.stat-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:14px; }
.stat-card { background:var(--card); border-radius:var(--radius); padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.07); }
.stat-card .num { font-size:28px; font-weight:800; color:var(--navy); }
.stat-card .lbl { font-size:12px; color:var(--muted); margin-top:2px; }
.stat-card.warn .num { color:var(--warn); }
.table-wrap { background:var(--card); border-radius:var(--radius); overflow:auto; box-shadow:0 1px 3px rgba(0,0,0,.07); }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { background:var(--navy); color:white; padding:10px 12px; text-align:left; white-space:nowrap; font-weight:600; }
td { padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr.unreported { background:#fff8f0; }
tr.total-row td { background:#f0ede8; font-weight:700; border-top:2px solid var(--border); }
.badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:600; }
.badge-ok   { background:#e8f5e9; color:var(--success); }
.badge-wait { background:#fff3e0; color:var(--warn); }
.diff-pos { color:#1565c0; }
.diff-neg { color:var(--danger); }
.hall-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.hall-card { background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.07); }
.hall-card.main-hall { border-left:4px solid var(--navy); }
.hall-title { font-size:16px; font-weight:700; color:var(--navy); margin-bottom:8px; }
.hall-count { font-size:32px; font-weight:800; color:var(--navy); margin-bottom:8px; }
.hall-count span { font-size:14px; font-weight:400; color:var(--muted); }
.detail-list { font-size:13px; color:var(--muted); border-top:1px solid var(--border); padding-top:8px; }
.detail-row { display:flex; justify-content:space-between; padding:3px 0; }
.tab-content { display:none; }
.tab-content.active { display:block; }
.empty-msg { text-align:center; padding:40px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>中台禪寺 — 法會人數統計</h1>
    <p>公開查看（唯讀）</p>
  </div>
</header>

<div class="container">

  <div style="text-align:center;padding:20px 0 12px;border-bottom:2px solid var(--border);margin-bottom:16px;">
    <div style="font-size:26px;font-weight:800;color:var(--navy);letter-spacing:1px;">法會接車人數及時統計</div>
  </div>

  <div class="control-bar">
    <label>活動：</label>
    <select id="activity-select" onchange="onActivityChange()">
      <option value="">— 載入中 —</option>
    </select>
    <button class="btn btn-outline btn-sm" onclick="refreshData()">↻ 重新整理</button>
    <span class="last-update" id="last-update"></span>
  </div>

  <div class="tab-group">
    <button class="tab-btn active" onclick="switchTab('comparison')">比較總覽</button>
    <button class="tab-btn" onclick="switchTab('hall')">殿堂視角</button>
    <button class="tab-btn" onclick="switchTab('meal')">齋供視角</button>
    <button class="tab-btn" onclick="switchTab('transport')">交通視角</button>
    <button class="tab-btn" onclick="switchTab('service')">服務台視角</button>
  </div>

  <div id="tab-comparison" class="tab-content active">
    <div id="comp-stats" class="stat-row"></div>
    <div id="comp-summary"></div>
    <div id="late-summary-below" class="hall-card" style="display:none;margin-top:10px;border-left:4px solid #e65100;justify-content:space-between;align-items:center;">
      <div style="font-size:17px;font-weight:600;color:#e65100;">以上人數含下午抵達人數合計</div>
      <div style="font-size:28px;font-weight:800;color:#e65100;"><span id="late-summary-num">0</span> 人</div>
    </div>
    <!-- 密碼鎖 -->
    <div id="detail-lock" style="margin-top:16px;background:#fff;border-radius:12px;padding:28px 24px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.07);">
      <div style="font-size:32px;margin-bottom:10px;">🔒</div>
      <div style="font-size:15px;font-weight:600;color:var(--navy);margin-bottom:6px;">各精舍詳細數據</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:18px;">輸入密碼以查看各精舍回報明細</div>
      <div style="display:flex;gap:8px;justify-content:center;max-width:320px;margin:0 auto;">
        <input id="detail-pw" type="password" placeholder="請輸入密碼"
          style="flex:1;padding:9px 12px;border:1px solid #ccc;border-radius:8px;font-size:14px;"
          onkeydown="if(event.key==='Enter')unlockDetail()">
        <button onclick="unlockDetail()"
          style="padding:9px 18px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">
          解鎖
        </button>
      </div>
      <div id="detail-pw-err" style="color:var(--danger);font-size:12px;margin-top:8px;min-height:18px;"></div>
    </div>

    <!-- 詳細數據（預設隱藏） -->
    <div id="detail-section" style="display:none;margin-top:14px;">
      <div style="margin-bottom:8px;display:flex;align-items:center;gap:10px;">
        <input id="comp-search" type="text" placeholder="🔍 搜尋精舍名稱或代碼…"
          style="padding:7px 12px;border:1px solid #ccc;border-radius:8px;font-size:14px;width:100%;max-width:320px;"
          oninput="compSearch=this.value;renderComparison(dashCache?.compRows||[])">
        <button onclick="lockDetail()"
          style="padding:6px 12px;background:#f0ede8;color:var(--navy);border:1px solid #ccc;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;">
          🔒 重新鎖定
        </button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th rowspan="2" style="vertical-align:middle;">精舍</th>
              <th colspan="3" style="text-align:center;background:#2a4a7a;">── 報名人數 ──</th>
              <th colspan="3" style="text-align:center;background:#1a6030;">── 實到人數 ──</th>
              <th rowspan="2" style="vertical-align:middle;text-align:center;">落差</th>
              <th rowspan="2" style="vertical-align:middle;text-align:center;">報到率</th>
            </tr>
            <tr>
              <th>參加法會</th><th>法師</th><th>義工</th>
              <th>參加法會</th><th>法師</th><th>義工</th>
            </tr>
          </thead>
          <tbody id="comp-detail-body"><tr><td colspan="9" class="empty-msg">請先選擇活動</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="tab-hall" class="tab-content">
    <div id="hall-content"><div class="empty-msg">請先選擇活動</div></div>
  </div>

  <div id="tab-meal" class="tab-content">
    <div id="meal-content"><div class="empty-msg">請先選擇活動</div></div>
  </div>

  <div id="tab-transport" class="tab-content">
    <div id="transport-content"><div class="empty-msg">請先選擇活動</div></div>
  </div>

  <div id="tab-service" class="tab-content">
    <div id="service-content"><div class="empty-msg">請先選擇活動</div></div>
  </div>

</div>

<script>
// ── 填入你的 Supabase 設定 ──────────────────────────────────
const SUPABASE_URL = 'https://dfqcbwresfwejiudlqso.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NnGcMxbnG_D_3qDeFahMqQ_MjSsPzHQ';
// ────────────────────────────────────────────────────────────

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentTab = 'comparison';
let dashCache  = null;
let compSearch = '';
const DETAIL_PASSWORD = 'ctcm2026';

function unlockDetail() {
  const pw = document.getElementById('detail-pw').value;
  if (pw !== DETAIL_PASSWORD) {
    document.getElementById('detail-pw-err').textContent = '密碼錯誤，請重試';
    document.getElementById('detail-pw').value = '';
    return;
  }
  document.getElementById('detail-lock').style.display = 'none';
  document.getElementById('detail-section').style.display = 'block';
  document.getElementById('detail-pw-err').textContent = '';
  if (dashCache) renderComparison();
}

function lockDetail() {
  document.getElementById('detail-section').style.display = 'none';
  document.getElementById('detail-lock').style.display = 'block';
  document.getElementById('detail-pw').value = '';
}
const ALL_TABS = ['comparison','hall','meal','transport','service'];

async function init() {
  const { data } = await sb.from('events').select('id,name,status').order('date', { ascending: false });
  const sel = document.getElementById('activity-select');
  sel.innerHTML = '<option value="">— 請選擇活動 —</option>';
  (data || []).forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.id;
    opt.textContent = e.name + (e.status === '進行中' ? ' ✦' : '');
    sel.appendChild(opt);
  });
  // 自動選進行中的活動
  const active = (data || []).find(e => e.status === '進行中');
  if (active) { sel.value = active.id; fetchDashboard(active.id); }
}

function onActivityChange() {
  const id = document.getElementById('activity-select').value;
  if (id) fetchDashboard(id);
}

function refreshData() {
  const id = document.getElementById('activity-select').value;
  if (id) fetchDashboard(id);
}

async function fetchDashboard(actId) {
  dashCache = null;
  document.getElementById('last-update').textContent = '載入中…';

  const [templesRes, estRes, restRes, repRes, eventRes] = await Promise.all([
    sb.from('temples').select('*').order('number'),
    sb.from('estimates').select('*').eq('event_id', actId),
    sb.from('rest_areas').select('*').eq('event_id', actId),
    sb.from('reports').select('*').eq('event_id', actId),
    sb.from('events').select('enable_late_arrival').eq('id', actId).maybeSingle()
  ]);
  const enableLateArrival = !!(eventRes.data?.enable_late_arrival);

  const temples = templesRes.data || [];
  const estMap  = Object.fromEntries((estRes.data || []).map(r => [r.temple_number, r]));
  const restMap = Object.fromEntries((restRes.data || []).map(r => [r.temple_number, r.description]));
  const repMap  = Object.fromEntries((repRes.data || []).map(r => [r.temple_number, r]));

  // 過濾：只留有上傳預估資料（且非全零）或有設定休息區的精舍
  const participatingTemples = temples.filter(t => {
    const est = estMap[t.number];
    const rest = restMap[t.number];
    if (!est && !rest) return false;
    if (rest) return true;
    return !!(est.vip || est.lay || est.monk || est.volunteer || est.driver || est.seat_count);
  });

  // 比較總覽
  const compRows = participatingTemples.filter(t => estMap[t.number] !== undefined).map(t => {
    const est = estMap[t.number];
    const rep = repMap[t.number];
    const estLay  = (est.vip||0)+(est.lay||0);
    const estMonk = est.monk||0;
    const estVol  = est.volunteer||0;
    const repLay  = rep ? (rep.vip||0)+rep.lay : null;
    const repMonk = rep ? rep.monk : null;
    const repVol  = rep ? (rep.volunteer||0) : null;
    const estPeople = estLay + estMonk + estVol;
    const repPeople = rep ? repLay + repMonk + repVol : null;
    const diffPeople = repPeople !== null ? repPeople - estPeople : null;
    return { number: t.number, name: t.name, reported: !!rep, estLay, estMonk, estVol, estPeople, repLay, repMonk, repVol, repPeople, diffPeople,
             lateArrival: rep ? (rep.late_arrival || 0) : null };
  });

  // 報名 / 實到 類別加總（不含便當）
  const estSummary = { lay: 0, monk: 0, volunteer: 0, total: 0 };
  const repSummary = { lay: 0, monk: 0, volunteer: 0, total: 0, lateArrival: 0 };
  participatingTemples.forEach(t => {
    const est = estMap[t.number];
    if (est) {
      const lay = (est.vip||0) + (est.lay||0);
      estSummary.lay += lay;
      estSummary.monk += est.monk || 0;
      estSummary.volunteer += est.volunteer || 0;
      estSummary.total += lay + (est.monk||0) + (est.volunteer||0);
    }
    const rep = repMap[t.number];
    if (rep) {
      const lay = (rep.vip||0) + rep.lay;
      repSummary.lay += lay;
      repSummary.monk += rep.monk || 0;
      repSummary.volunteer += rep.volunteer || 0;
      repSummary.total += lay + (rep.monk||0) + (rep.volunteer||0);
      repSummary.lateArrival += rep.late_arrival || 0;
    }
  });

  // 殿堂視角
  const hallMap = {};
  let totalVipGuest = 0;
  let totalHallCount = 0;
  // 主壇 = 所有精舍預估貴賓加總（不等回報）
  const mainCount = participatingTemples.reduce((s, t) => s + (estMap[t.number]?.vip || 0), 0);
  // 全場信眾+法師 = 預估加總（不等回報）
  const totalEstLayMonk = participatingTemples.reduce((s, t) => {
    const rep = repMap[t.number];
    if (!rep) return s;
    return s + (rep.vip||0) + rep.lay + rep.monk;
  }, 0);

  participatingTemples.forEach(t => {
    const rep = repMap[t.number];
    const est = estMap[t.number];
    if (!rep) return;
    const vipGuest = est?.vip || 0;
    const 信眾 = (rep.vip || 0) + rep.lay;
    const layMonk = 信眾 + rep.monk;
    const hallCount = layMonk - vipGuest; // 壇區 = 信眾+法師-貴賓
    totalHallCount += hallCount;
    const hall = restMap[t.number] || '（未分配）';
    if (!hallMap[hall]) hallMap[hall] = { count: 0, detail: [] };
    hallMap[hall].count += hallCount;
    hallMap[hall].detail.push({ name: t.name, lay: 信眾, monk: rep.monk, vip: vipGuest, sub: hallCount, total: layMonk });
  });

  // 精舍視角
  const templeRows = participatingTemples.map(t => {
    const rep = repMap[t.number];
    if (!rep) return null;
    const 信眾 = (rep.vip||0) + rep.lay;
    const volunteer = rep.volunteer || 0;
    return { number: t.number, name: t.name, 信眾, monk: rep.monk, volunteer, driver: rep.driver,
             bigCar: rep.big_car || 0, returnCount: rep.return_count || 0,
             total: 信眾+rep.monk+volunteer,
             reportedAt: new Date(rep.reported_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}) };
  }).filter(Boolean);
  const 總計 = templeRows.reduce(
    (a, r) => ({ 信眾:a.信眾+r.信眾, monk:a.monk+r.monk, volunteer:a.volunteer+r.volunteer, driver:a.driver+r.driver, bigCar:a.bigCar+r.bigCar, total:a.total+r.total }),
    { 信眾:0, monk:0, volunteer:0, driver:0, bigCar:0, total:0 }
  );

  // 齋供視角
  const mealMap = {};
  let mealTotal = 0;
  participatingTemples.forEach(t => {
    const rep = repMap[t.number];
    if (!rep) return;
    const hall = restMap[t.number] || '（未分配）';
    if (!mealMap[hall]) mealMap[hall] = { count: 0, detail: [] };
    mealMap[hall].count += rep.driver;
    mealMap[hall].detail.push({ name: t.name, count: rep.driver });
    mealTotal += rep.driver;
  });

  // 服務台視角
  const serviceMap = {};
  let serviceDriverTotal = 0, serviceReturnTotal = 0;
  participatingTemples.forEach(t => {
    const rep = repMap[t.number];
    if (!rep) return;
    const hall = restMap[t.number] || '（未分配）';
    if (!serviceMap[hall]) serviceMap[hall] = { driver: 0, returnCount: 0, detail: [] };
    serviceMap[hall].driver += rep.driver;
    serviceMap[hall].returnCount += rep.return_count || 0;
    serviceMap[hall].detail.push({ name: t.name, driver: rep.driver, returnCount: rep.return_count || 0 });
    serviceDriverTotal += rep.driver;
    serviceReturnTotal += rep.return_count || 0;
  });

  dashCache = { compRows, estSummary, repSummary, mainCount, totalEstLayMonk, totalHallCount, hallMap, templeRows, 總計, mealMap, mealTotal,
                serviceMap, serviceDriverTotal, serviceReturnTotal,
                未回報數: compRows.filter(r => !r.reported).length, enableLateArrival };
  document.getElementById('last-update').textContent =
    '更新：' + new Date().toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei'});
  renderCurrentTab();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.getAttribute('onclick').includes("'"+tab+"'"))
  );
  ALL_TABS.forEach(t => {
    const el = document.getElementById('tab-'+t);
    if (el) el.classList.toggle('active', t === tab);
  });
  renderCurrentTab();
}

function renderCurrentTab() {
  if (!dashCache) return;
  if (currentTab === 'comparison') renderComparison();
  else if (currentTab === 'hall')   renderHall();
  else if (currentTab === 'meal')      renderMeal();
  else if (currentTab === 'transport') renderTransport();
  else if (currentTab === 'service')   renderService();
}

function renderComparison() {
  const c = dashCache;
  const late = c.enableLateArrival;
  const reported = c.compRows.filter(r => r.reported).length;
  const 報到率 = c.estSummary.total > 0
    ? ((c.repSummary.total / c.estSummary.total) * 100).toFixed(1) + '%'
    : '—';
  const diff = c.repSummary.total - c.estSummary.total;
  const diffStr = diff > 0 ? '+' + diff : String(diff);
  const diffColor = diff >= 0 ? '#1565c0' : 'var(--danger)';
  const repRows = c.compRows.filter(r => r.reported);
  const totLateArr = repRows.reduce((s,r) => s+(r.lateArrival||0), 0);

  document.getElementById('comp-stats').innerHTML = [
    { lbl:'參與精舍', num: c.compRows.length },
    { lbl:'已回報',   num: reported },
    { lbl:'未回報',   num: c.未回報數, warn: c.未回報數 > 0 },
    { lbl:'報到率',   num: 報到率 },
  ].map(s => `<div class="stat-card${s.warn?' warn':''}"><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>`).join('');

  function summaryCard(title, data, accentColor, extraItems = []) {
    const items = [['信眾', data.lay], ['法師', data.monk], ['義工', data.volunteer], ...extraItems, ['合計', data.total]];
    const cols = items.length > 4 ? 'repeat(3, 1fr)' : '1fr 1fr';
    return `<div class="hall-card" style="border-left:4px solid ${accentColor};">
      <div class="hall-title" style="font-size:15px;color:${accentColor};margin-bottom:12px;">${title}</div>
      <div style="display:grid;grid-template-columns:${cols};gap:12px;">
        ${items.map(([l, n]) => `
          <div style="text-align:center;">
            <div style="font-size:28px;font-weight:800;color:var(--navy);">${n}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;">${l}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  const diffFmt = v => v === null ? '—' : (v > 0 ? `<span class="diff-pos">+${v}</span>` : v < 0 ? `<span class="diff-neg">${v}</span>` : '±0');

  document.getElementById('comp-summary').innerHTML =
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
      ${summaryCard('📋 已報名', c.estSummary, '#2d4a6e')}
      ${summaryCard('✅ 實到', c.repSummary, '#2e7d32')}
    </div>
    <div class="hall-card" style="border-left:4px solid ${diffColor};display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:17px;font-weight:600;color:${diffColor};">差異總計（實到－報名）</div>
      <div style="font-size:28px;font-weight:800;color:${diffColor};">${c.estSummary.total > 0 ? diffStr : '—'}</div>
    </div>`;

  // 詳細對照表（合入比較總覽）
  const rows     = c.compRows;
  const totELay  = rows.reduce((s,r) => s+r.estLay,  0);
  const totEMonk = rows.reduce((s,r) => s+r.estMonk, 0);
  const totEVol  = rows.reduce((s,r) => s+r.estVol,  0);
  const totRLay  = repRows.reduce((s,r) => s+r.repLay,  0);
  const totRMonk = repRows.reduce((s,r) => s+r.repMonk, 0);
  const totRVol  = repRows.reduce((s,r) => s+r.repVol,  0);
  const totDiff    = (totRLay+totRMonk+totRVol) - (totELay+totEMonk+totEVol);
  const totEPpl    = totELay + totEMonk + totEVol;
  const totRPpl    = totRLay + totRMonk + totRVol;
  const totRate    = totEPpl > 0 ? Math.round(totRPpl / totEPpl * 100) + '%' : '—';
  let sorted = [...rows].sort((a,b) => a.number.localeCompare(b.number));
  if (compSearch.trim()) {
    const q = compSearch.trim().toLowerCase();
    sorted = sorted.filter(r => r.name.toLowerCase().includes(q) || r.number.toLowerCase().includes(q));
  }

  const lateEl = document.getElementById('late-summary-below');
  if (late) { lateEl.style.display = 'flex'; document.getElementById('late-summary-num').textContent = totLateArr; }
  else { lateEl.style.display = 'none'; }

  document.getElementById('comp-detail-body').innerHTML =
    sorted.map(r => `<tr${!r.reported?' class="unreported"':''}>
      <td><span style="color:var(--muted);font-size:12px;margin-right:4px;">${r.number}</span>${r.name}${!r.reported ? ' <span class="badge badge-wait" style="font-size:10px;">未回報</span>' : ''}</td>
      <td style="text-align:center;">${r.estLay}</td>
      <td style="text-align:center;">${r.estMonk}</td>
      <td style="text-align:center;">${r.estVol}</td>
      <td style="text-align:center;">${r.reported ? r.repLay  : '—'}</td>
      <td style="text-align:center;">${r.reported ? r.repMonk : '—'}</td>
      <td style="text-align:center;">${r.reported ? r.repVol  : '—'}</td>
      <td style="text-align:center;">${diffFmt(r.diffPeople)}</td>
      <td style="text-align:center;">${r.報到率||'—'}</td>
    </tr>`).join('') +
    `<tr style="background:#f0ede8;font-weight:700;border-top:2px solid var(--navy);">
      <td>合計（已回報 ${repRows.length}／${rows.length} 間）</td>
      <td style="text-align:center;">${totELay}</td><td style="text-align:center;">${totEMonk}</td><td style="text-align:center;">${totEVol}</td>
      <td style="text-align:center;">${totRLay}</td><td style="text-align:center;">${totRMonk}</td><td style="text-align:center;">${totRVol}</td>
      <td style="text-align:center;">${diffFmt(totDiff)}</td>
      <td style="text-align:center;">${totRate}</td>
    </tr>`;
}

function renderTransport() {
  const rows  = dashCache.templeRows;
  const total = dashCache.總計.bigCar;
  const el    = document.getElementById('transport-content');
  if (!rows.length) { el.innerHTML = '<div class="empty-msg">尚無回報資料</div>'; return; }
  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>精舍</th>
          <th style="text-align:center;">大車數（台）</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td><span style="color:var(--muted);font-size:12px;margin-right:4px;">${r.number}</span><span style="font-size:17px;">${r.name}</span></td>
            <td style="text-align:center;font-size:20px;font-weight:700;color:var(--navy);">${r.bigCar}</td>
          </tr>`).join('')}
          <tr style="background:#f0ede8;font-weight:700;border-top:2px solid var(--navy);">
            <td>合計</td>
            <td style="text-align:center;font-size:20px;">${total}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
}

function renderHall() {
  const c = dashCache;
  let html = '<div class="hall-grid">';
  html += `<div class="hall-card main-hall">
    <div class="hall-title">🏛 主壇</div>
    <div class="hall-count">${c.mainCount} <span>人</span></div>
    <div class="detail-list">
      <div class="detail-row"><span>全場人數（已回報）</span><span>${c.totalEstLayMonk} 人</span></div>
      <div class="detail-row" style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.2);font-weight:600;"><span>各壇區信眾合計（已回報）</span><span></span></div>
      ${Object.entries(c.hallMap).filter(([hall]) => hall !== '（未分配）').map(([hall, v]) => `<div class="detail-row"><span>${hall}</span><span>${v.count} 人</span></div>`).join('')}
      <div class="detail-row" style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.2);font-weight:600;"><span>合計</span><span>${c.totalHallCount} 人</span></div>
    </div></div>`;
  Object.entries(c.hallMap).filter(([hall]) => hall !== '（未分配）').forEach(([hall, v]) => {
    html += `<div class="hall-card">
      <div class="hall-title">📍 ${hall}</div>
      <div class="hall-count">${v.count} <span>人（信眾+法師）</span></div>`;
    if (v.detail.length) html += '<div class="detail-list">' +
      v.detail.map(d => `<div class="detail-row"><span>${d.name}</span><span>${d.sub} 人</span></div>`).join('') + '</div>';
    html += '</div>';
  });
  document.getElementById('hall-content').innerHTML = html + '</div>';
}


function renderMeal() {
  const c = dashCache;
  const entries = Object.entries(c.mealMap).filter(([hall]) => hall !== '（未分配）');
  if (!entries.length) {
    document.getElementById('meal-content').innerHTML = '<div class="empty-msg">尚無回報資料</div>';
    return;
  }
  let html = '<div class="hall-grid">';
  entries.forEach(([hall, v]) => {
    html += `<div class="hall-card">
      <div class="hall-title">🍱 ${hall}</div>
      <div class="hall-count">${v.count} <span>份</span></div>`;
    if (v.detail.length) html += '<div class="detail-list">' +
      v.detail.map(d => `<div class="detail-row" style="font-size:18px;padding:4px 0;"><span style="font-weight:600;">${d.name}</span><span>${d.count} 份</span></div>`).join('') + '</div>';
    html += '</div>';
  });
  html += `<div class="hall-card" style="background:#f0ede8;">
    <div class="hall-title">📊 便當總計</div>
    <div class="hall-count">${c.mealTotal} <span>份</span></div>
  </div>`;
  document.getElementById('meal-content').innerHTML = html + '</div>';
}

function renderService() {
  const c = dashCache;
  const entries = Object.entries(c.serviceMap).filter(([hall]) => hall !== '（未分配）');
  if (!entries.length) {
    document.getElementById('service-content').innerHTML = '<div class="empty-msg">尚無回報資料</div>';
    return;
  }
  let html = '<div class="hall-grid">';
  entries.forEach(([hall, v]) => {
    html += `<div class="hall-card">
      <div class="hall-title">📋 ${hall}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px;">
        便當 ${v.driver} 份　回點 ${v.returnCount} 點
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eee;padding:6px 0 4px;">
        <div style="flex:1;"></div>
        <div style="display:flex;gap:16px;text-align:center;">
          <div style="font-size:15px;font-weight:700;color:var(--navy);width:56px;">便當</div>
          <div style="font-size:15px;font-weight:700;color:#2e7d32;width:56px;">回點</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:0;">
        ${v.detail.map(d => `
          <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f0f0f0;padding:6px 0;">
            <div style="font-size:28px;font-weight:600;color:#333;flex:1;">${d.name}</div>
            <div style="display:flex;gap:16px;text-align:center;">
              <div style="font-size:28px;font-weight:800;color:var(--navy);width:56px;">${d.driver}</div>
              <div style="font-size:28px;font-weight:800;color:#2e7d32;width:56px;">${d.returnCount}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  });
  html += `<div class="hall-card" style="background:#f0ede8;">
    <div class="hall-title">📊 總計</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;margin-top:8px;">
      <div><div style="font-size:12px;color:var(--muted);">便當總計</div><div style="font-size:22px;font-weight:800;color:var(--navy);">${c.serviceDriverTotal} <span style="font-size:14px;">份</span></div></div>
      <div><div style="font-size:12px;color:var(--muted);">回點總計</div><div style="font-size:22px;font-weight:800;color:#2e7d32;">${c.serviceReturnTotal} <span style="font-size:14px;">點</span></div></div>
    </div>
  </div>`;
  document.getElementById('service-content').innerHTML = html + '</div>';
}

init();
</script>
</body>
</html>
